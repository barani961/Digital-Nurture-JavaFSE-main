<h1>{{ portalName }}</h1>

<p>
Welcome to the Student Course Portal.
Browse available courses and manage your profile.
</p>

<hr>

<h3>Statistics</h3>

<p>Courses Available : 12</p>

<p>Enrolled : 3</p>

<p>GPA : 3.8</p>

<hr>

<button
    [disabled]="!isPortalActive"
    (click)="onEnrollClick()">

    Enroll Now

</button>

<p>{{ message }}</p>

<hr>

<input
type="text"
placeholder="Search Course"
[(ngModel)]="searchTerm">

<p>
Searching for:
{{ searchTerm }}
</p>
