<h2>Student Enrollment Form</h2>

<form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">
  <label>Student Name</label>

  <br />

  <input type="text" name="studentName" ngModel required minlength="3" #nameCtrl="ngModel" />

  <br />
  <span *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']"> Name is required </span>

  <span *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']">
    Name must be at least 3 characters </span
  ><br />

  <label>Email</label>

  <br />

  <input type="email" name="studentEmail" ngModel required email #emailCtrl="ngModel" />

  <br /><span *ngIf="emailCtrl.touched && emailCtrl.errors?.['required']"> Email is required </span>

  <span *ngIf="emailCtrl.touched && emailCtrl.errors?.['email']"> Invalid Email </span><br />

  <label>Course ID</label>

  <br />

  <input type="number" name="courseId" ngModel required #courseCtrl="ngModel" />

  <br /><span *ngIf="courseCtrl.touched && courseCtrl.errors?.['required']">
    Course ID Required </span
  ><br />

  <label>Preferred Semester</label>

  <br />

  <select name="preferredSemester" ngModel>
    <option value="Odd">Odd</option>

    <option value="Even">Even</option>
  </select>

  <br /><br />

  <input type="checkbox" name="agreeToTerms" ngModel required #termsCtrl="ngModel" />

  I Agree

  <br /><span *ngIf="termsCtrl.touched && termsCtrl.errors?.['required']">
    Please accept Terms </span
  ><br />

  <button type="submit" [disabled]="enrollForm.invalid">Submit</button>
  <div *ngIf="submitted">Enrollment request submitted successfully!</div>
  <button type="button" (click)="enrollForm.resetForm()">Reset</button>
</form>
