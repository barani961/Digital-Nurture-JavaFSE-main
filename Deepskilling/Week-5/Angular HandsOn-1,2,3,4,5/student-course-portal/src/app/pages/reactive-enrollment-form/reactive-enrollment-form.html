<h2>Reactive Enrollment Form</h2>

<form
  [formGroup]="enrollForm"
  (ngSubmit)="onSubmit()">

  <!-- Student Name -->

  <div>

    <label>Student Name</label><br>

    <input
      type="text"
      formControlName="studentName">

    <br>

    <span
      *ngIf="
      enrollForm.get('studentName')?.touched &&
      enrollForm.get('studentName')?.errors?.['required']
      "
      class="error">

      Name is required

    </span>

    <span
      *ngIf="
      enrollForm.get('studentName')?.touched &&
      enrollForm.get('studentName')?.errors?.['minlength']
      "
      class="error">

      Minimum 3 characters required

    </span>

  </div>

  <br>

  <!-- Student Email -->

  <div>

    <label>Email</label><br>

    <input
      type="email"
      formControlName="studentEmail">

    <br>

    <span
      *ngIf="
      enrollForm.get('studentEmail')?.touched &&
      enrollForm.get('studentEmail')?.errors?.['required']
      "
      class="error">

      Email is required

    </span>

    <span
      *ngIf="
      enrollForm.get('studentEmail')?.errors?.['email']
      "
      class="error">

      Invalid Email

    </span>

    <span
      *ngIf="
      enrollForm.get('studentEmail')?.pending
      "
      class="info">

      Checking email...

    </span>

    <span
      *ngIf="
      enrollForm.get('studentEmail')?.errors?.['emailTaken']
      "
      class="error">

      Email already taken

    </span>

  </div>

  <br>

  <!-- Course ID -->

  <div>

    <label>Course ID</label><br>

    <input
      type="text"
      formControlName="courseId">

    <br>

    <span
      *ngIf="
      enrollForm.get('courseId')?.errors?.['required']
      "
      class="error">

      Course ID required

    </span>

    <span
      *ngIf="
      enrollForm.get('courseId')?.errors?.['noCourseCode']
      "
      class="error">

      Course code starting with XX is not allowed.

    </span>

  </div>

  <br>

  <!-- Semester -->

  <div>

    <label>Preferred Semester</label><br>

    <select formControlName="preferredSemester">

      <option value="Odd">Odd</option>

      <option value="Even">Even</option>

    </select>

  </div>

  <br>

  <!-- Terms -->

  <div>

    <input
      type="checkbox"
      formControlName="agreeToTerms">

    I Agree to Terms & Conditions

  </div>

  <br>

  <!-- Additional Courses -->

  <h3>Additional Courses</h3>

  <button
    type="button"
    (click)="addCourse()">

    Add Another Course

  </button>

  <br><br>

  <div
    formArrayName="additionalCourses">

    <div *ngFor="let ctrl of additionalCourses.controls; let i = index">

      <input
        [formControl]="ctrl"
        placeholder="Course Name">

      <button
        type="button"
        (click)="removeCourse(i)">

        Remove

      </button>

      <br><br>

    </div>

  </div>

  <button
    type="submit"
    [disabled]="enrollForm.invalid">

    Submit

  </button>

</form>
