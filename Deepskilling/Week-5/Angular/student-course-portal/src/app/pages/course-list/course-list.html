<!-- Loading -->
<div *ngIf="isLoading">
    <h2>Loading courses...</h2>
</div>

<!-- After loading -->
<div *ngIf="!isLoading">

    <div *ngIf="courses.length > 0; else noCourses">

        <app-course-card
            *ngFor="let course of courses; trackBy: trackByCourseId"
            [course]="course"
            (enrollRequested)="onEnroll($event)"
            appHighlight="lightblue">
        </app-course-card>

    </div>

</div>

<ng-template #noCourses>
    <h3>No courses available.</h3>
</ng-template>

<p *ngIf="selectedCourseId">
    <strong>Selected Course ID:</strong>
    {{ selectedCourseId }}
</p>
